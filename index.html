<<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Fire Top Up</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="topbar">
    <img src="img/ff.jpg" class="logo-small">

    <div>
      <h1>Top Up Resmi</h1>
      <p>Free Fire</p>
    </div>
  </div>

  <div class="banner"></div>

  <div class="card">
    <img src="img/banner.jpg" class="game-img">

    <h2>Garena Free Fire</h2>
    <p>Top Up Diamond Murah & Cepat</p>
  </div>

  <div class="section">
    <h2>Login</h2>

    <div class="login-box">
      <input type="text" id="playerId" placeholder="Masukkan Player ID">

      <button onclick="cekID()">Cek ID</button>
    </div>

    <p id="hasil"></p>
  </div>

  <div class="section">
    <h2>Pilih Diamond</h2>

    <div class="diamond-grid">

      <div class="diamond" onclick="pilihDiamond(this,'5 Diamond')">
        💎 5
      </div>

      <div class="diamond" onclick="pilihDiamond(this,'12 Diamond')">
        💎 12
      </div>

      <div class="diamond" onclick="pilihDiamond(this,'50 Diamond')">
        💎 50
      </div>

      <div class="diamond" onclick="pilihDiamond(this,'70 Diamond')">
        💎 70
      </div>

      <div class="diamond" onclick="pilihDiamond(this,'140 Diamond')">
        💎 140
      </div>

      <div class="diamond" onclick="pilihDiamond(this,'355 Diamond')">
        💎 355
      </div>

    </div>
  </div>

  <button class="buy-btn" onclick="beli()">
    Beli Sekarang
  </button>

  <script src="script.js"></script>

</body>
</html>
